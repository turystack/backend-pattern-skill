name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  # Called by publish.yml, so nothing reaches npm without this passing.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # This package ships content, not code: no dependencies, no lockfile, so
      # there is nothing to install or compile. What can still break is the
      # manifest and the `files` glob, and that is exactly what is checked.
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Verify publishable contents
        run: npm pack --dry-run
